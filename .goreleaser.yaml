version: 2

project_name: mulch

before:
  hooks:
    - sh -c "cd ui && npm ci && npm run build"

builds:
  - id: mulch
    main: ./cmd/mulch
    binary: mulch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - mulch
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  extra_files:
    - glob: scripts/install.sh
